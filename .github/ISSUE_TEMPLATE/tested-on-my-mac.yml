name: Tested on my Mac
description: Tell me whether kbsync worked on your Mac. Reports that it works are just as useful.
title: "Tested on: "
labels: ["compatibility"]
body:
  - type: input
    id: model
    attributes:
      label: Mac model
      description: Apple menu → About This Mac
      placeholder: MacBook Air (M2, 2022)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.6"
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: How you ran kbsync
      options:
        - Menu bar app
        - Command line
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Did the keyboard follow the screen?
      options:
        - "Yes"
        - Partly
        - "No"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: For problems, paste the output of `kbsync status` or `kbsync run -v`.
